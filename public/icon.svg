<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner glowing ambient glow -->
  <circle cx="256" cy="256" r="180" fill="#818cf8" opacity="0.15" />

  <!-- Wallet Body -->
  <rect x="96" y="140" width="320" height="232" rx="36" fill="url(#cardGrad)" stroke="#a5b4fc" stroke-width="8" />

  <!-- Wallet Upper flap line -->
  <path d="M 96 210 L 416 210" stroke="#312e81" stroke-width="8" opacity="0.6" />

  <!-- Front Clasp -->
  <rect x="290" y="210" width="130" height="92" rx="20" fill="#1e1b4b" stroke="#818cf8" stroke-width="6" />
  
  <!-- Golden Coin Button on Clasp -->
  <circle cx="355" cy="256" r="22" fill="url(#coinGrad)" stroke="#fef3c7" stroke-width="4" />
  <text x="355" y="264" font-size="20" font-weight="bold" fill="#78350f" text-anchor="middle" font-family="Arial, sans-serif">Rp</text>

  <!-- Sparkle floating coin on top -->
  <circle cx="170" cy="120" r="32" fill="url(#coinGrad)" stroke="#fde68a" stroke-width="5" />
  <text x="170" y="128" font-size="22" font-weight="900" fill="#78350f" text-anchor="middle" font-family="Arial, sans-serif">★</text>
</svg>

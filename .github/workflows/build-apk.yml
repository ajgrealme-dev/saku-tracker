name: Build and Release Android APK

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions: write-all

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Copy Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: Build Android APK with Gradle
        run: |
          chmod +x ./android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK File
        run: |
          mkdir -p release_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release_apk/SakuTracker-v1.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuTracker-v1.0-APK
          path: release_apk/SakuTracker-v1.0.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: SakuTracker v1.0.0 (Official Android APK)
          draft: false
          prerelease: false
          files: release_apk/SakuTracker-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
